<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ec">
  <meta name="description" content="Make a little latte art in 30 seconds.">
  <title>Little Latte</title>
  <link rel="stylesheet" href="style.css?v=phone2">
</head>
<body>
  <div class="app">
    <header class="topbar"><span class="brand">little latte<span>.</span></span></header>
    <main>
      <section class="stage" aria-label="Latte art game">
        <div id="scene" class="scene" tabindex="0" role="application" aria-label="Coffee cup. Tilt your phone to aim and hold the cup to pour."></div>
        <div class="hud"><div class="order-card"><canvas id="target-preview" width="128" height="128" aria-label="Client's finished latte example"></canvas><div class="order-label"><span id="client-avatar" class="client-avatar" aria-hidden="true"></span><span>Your order</span></div></div><div class="hud-right"><button id="recenter" hidden>Recenter</button><div id="timer" role="timer" aria-label="Seconds remaining">30</div></div></div>
        <div id="play-hint" class="play-hint" hidden><span>HOLD TO POUR</span><button id="finish">Serve</button></div>
      </section>
      <section id="ready-panel" class="panel" aria-label="How to play">
        <div class="instruction">
          <div class="demo" aria-hidden="true"><span class="demo-phone"><span class="demo-dot"></span></span><span class="demo-aim"></span></div>
          <p id="instruction-text"><span class="phone-only">Tilt to aim</span><span class="mouse-only">Move to aim</span><strong>Hold to pour</strong></p>
        </div>
        <p id="notice" role="status" hidden></p>
        <button id="start" class="primary" disabled>Loading cup…</button>
      </section>
      <section id="result-panel" class="panel result" aria-labelledby="result-title" hidden>
        <div class="result-heading"><h1 id="result-title">Your serve</h1><p><strong id="score">0</strong>% match</p></div>
        <div class="compare"><figure><canvas id="your-preview" width="128" height="128" aria-label="Your finished latte"></canvas><figcaption>Your latte</figcaption></figure><figure><canvas id="order-preview" width="128" height="128" aria-label="Client's requested latte"></canvas><figcaption>Client order</figcaption></figure></div>
        <button id="again" class="primary">Try again</button>
      </section>
    </main>
  </div>
  <script type="module" src="app.js?v=local-three1"></script>
</body>
</html>
